spring.application.name=EduTrackBackend

# Default / Local SQLite configuration (overridable via environment variables or prod profile)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:edutrack.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Server Configuration (Render assigns PORT environment variable)
server.port=${PORT:8080}

# Application CORS allowed origins (comma-separated, local defaults)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Initial Admin Credentials Configuration
app.admin.email=${ADMIN_EMAIL:admin@edutrack.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
